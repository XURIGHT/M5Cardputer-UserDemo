name: PC Remote Python Tests
on:
  push:
    branches: [feature/pc-remote-generic]
    paths:
      - 'pc_remote/windows/**'
      - '.github/workflows/pc-remote-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run protocol and catalog tests
        working-directory: pc_remote/windows
        run: python -m unittest discover -p 'test_*.py' -v
